<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deutsch Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F1E7;
  --surface:#FFFFFF;
  --surface-sunken:#EFE7D6;
  --border:#E4D9C4;
  --ink:#2A2724;
  --ink-soft:#6B6255;
  --ink-faint:#9C9284;
  --sage:#6F8C6C;
  --sage-soft:#E1E9DC;
  --sage-strong:#4F6B4C;
  --blue:#5A7B98;
  --blue-soft:#E3EAF0;
  --blue-strong:#3F5A73;
  --wine:#9B4F49;
  --wine-soft:#F1E0DD;
  --gold:#AD8A3F;
  --gold-soft:#F2EAD3;
  --shadow-sm:0 1px 2px rgba(42,32,10,0.05), 0 1px 1px rgba(42,32,10,0.04);
  --shadow:0 2px 4px rgba(42,32,10,0.05), 0 12px 28px -14px rgba(42,32,10,0.22);
  --shadow-lg:0 8px 16px rgba(42,32,10,0.06), 0 24px 48px -20px rgba(42,32,10,0.28);
  --r-sm:8px;
  --r-md:14px;
  --r-lg:20px;
  --font-display:'Fraunces', Georgia, serif;
  --font-body:'Karla', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono:'IBM Plex Mono', 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1B17;
    --surface:#262320;
    --surface-sunken:#2C2822;
    --border:#3B362D;
    --ink:#ECE5D8;
    --ink-soft:#B3A996;
    --ink-faint:#7C7565;
    --sage:#8FB08B;
    --sage-soft:#2B3529;
    --sage-strong:#B7D2B3;
    --blue:#8FAEC9;
    --blue-soft:#26313B;
    --blue-strong:#BFD8EA;
    --wine:#D68B84;
    --wine-soft:#3B2724;
    --gold:#D6B564;
    --gold-soft:#362D1C;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
    --shadow:0 2px 4px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.55);
    --shadow-lg:0 8px 16px rgba(0,0,0,0.35), 0 24px 48px -20px rgba(0,0,0,0.6);
  }
}
:root[data-theme="dark"]{
  --bg:#1D1B17;
  --surface:#262320;
  --surface-sunken:#2C2822;
  --border:#3B362D;
  --ink:#ECE5D8;
  --ink-soft:#B3A996;
  --ink-faint:#7C7565;
  --sage:#8FB08B;
  --sage-soft:#2B3529;
  --sage-strong:#B7D2B3;
  --blue:#8FAEC9;
  --blue-soft:#26313B;
  --blue-strong:#BFD8EA;
  --wine:#D68B84;
  --wine-soft:#3B2724;
  --gold:#D6B564;
  --gold-soft:#362D1C;
  --shadow-sm:0 1px 2px rgba(0,0,0,0.3);
  --shadow:0 2px 4px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.55);
  --shadow-lg:0 8px 16px rgba(0,0,0,0.35), 0 24px 48px -20px rgba(0,0,0,0.6);
}

*{box-sizing:border-box;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  margin:0;
  -webkit-font-smoothing:antialiased;
  font-size:15px;
  line-height:1.5;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance;color:var(--ink);}
p{margin:0;}
button{font-family:inherit;font-size:inherit;}
input,select,textarea{font-family:inherit;font-size:inherit;color:var(--ink);}
::selection{background:var(--sage-soft);}
a{color:var(--blue-strong);}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.hidden{display:none !important;}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}

/* ---------- shell ---------- */
.app-shell{display:flex;min-height:100vh;}
.sidebar{
  width:232px;flex:none;background:var(--surface-sunken);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:22px 14px;gap:22px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{padding:0 8px;}
.brand-title{font-family:var(--font-display);font-size:19px;font-weight:600;letter-spacing:.2px;}
.brand-sub{font-size:11.5px;color:var(--ink-soft);margin-top:3px;letter-spacing:.2px;}
.level-chip{
  margin:2px 6px 0;padding:9px 12px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow-sm);
}
.level-chip .lc-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink-faint);}
.level-chip .lc-value{font-family:var(--font-mono);font-weight:600;font-size:15px;color:var(--sage-strong);}
.nav-group{display:flex;flex-direction:column;gap:2px;flex:1;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:var(--r-sm);color:var(--ink-soft);
  text-decoration:none;cursor:pointer;border:none;background:transparent;width:100%;text-align:left;font-size:13.5px;font-weight:500;
  transition:background .12s ease, color .12s ease;
}
.nav-item svg{width:17px;height:17px;flex:none;opacity:.85;}
.nav-item:hover{background:var(--surface);color:var(--ink);}
.nav-item.active{background:var(--sage-soft);color:var(--sage-strong);font-weight:600;}
.nav-item.active svg{opacity:1;}
.sidebar-foot{padding:0 8px;font-size:11px;color:var(--ink-faint);}

.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:14px 28px;
}
.search-wrap{position:relative;flex:1;max-width:480px;}
.search-input{
  width:100%;padding:9px 14px 9px 36px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--ink);
}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-faint);pointer-events:none;}
.search-results{
  position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--r-md);box-shadow:var(--shadow-lg);max-height:60vh;overflow-y:auto;z-index:30;
}
.search-group-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint);padding:10px 14px 4px;}
.search-result-row{padding:9px 14px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:baseline;}
.search-result-row:hover{background:var(--surface-sunken);}
.search-empty{padding:16px 14px;color:var(--ink-faint);font-size:13px;}
.topbar-spacer{flex:1;}
.icon-btn{
  width:36px;height:36px;border-radius:999px;border:1px solid var(--border);background:var(--surface);display:flex;
  align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);flex:none;
}
.icon-btn:hover{color:var(--ink);border-color:var(--ink-faint);}
.icon-btn svg{width:16px;height:16px;}

.view{padding:26px 28px 100px;max-width:1180px;}
.view-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.view-title{font-size:26px;}
.view-sub{color:var(--ink-soft);font-size:13.5px;margin-top:4px;}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface);color:var(--ink);cursor:pointer;font-weight:600;font-size:13.5px;white-space:nowrap;
  transition:transform .08s ease, box-shadow .12s ease;
}
.btn:hover{box-shadow:var(--shadow-sm);}
.btn:active{transform:scale(.97);}
.btn svg{width:15px;height:15px;}
.btn-primary{background:var(--sage-strong);border-color:var(--sage-strong);color:#fff;}
.btn-primary:hover{background:var(--sage-strong);filter:brightness(1.06);}
.btn-ghost{background:transparent;border-color:transparent;}
.btn-ghost:hover{background:var(--surface-sunken);}
.btn-danger{color:var(--wine);border-color:var(--wine-soft);background:var(--wine-soft);}
.btn-sm{padding:6px 12px;font-size:12.5px;}
.btn-block{width:100%;justify-content:center;}
.btn[disabled]{opacity:.5;cursor:not-allowed;}

/* ---------- cards & grids ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--shadow-sm);}
.card-pad{padding:18px 20px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin-bottom:22px;}
.stat-tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:16px 18px;box-shadow:var(--shadow-sm);}
.stat-tile .st-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint);}
.stat-tile .st-value{font-family:var(--font-display);font-size:30px;margin-top:6px;color:var(--ink);}
.stat-tile .st-hint{font-size:12px;color:var(--ink-soft);margin-top:3px;}
.stat-tile.accent-sage{border-color:var(--sage-soft);}
.stat-tile.accent-sage .st-value{color:var(--sage-strong);}
.stat-tile.accent-gold .st-value{color:var(--gold);}
.stat-tile.accent-blue .st-value{color:var(--blue-strong);}

.dash-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start;}
@media (max-width:900px){.dash-grid{grid-template-columns:1fr;}}

.section-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px 22px;box-shadow:var(--shadow-sm);margin-bottom:18px;}
.section-card h3{font-size:16px;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
.section-head .count-pill{font-family:var(--font-mono);font-size:11px;color:var(--ink-faint);background:var(--surface-sunken);padding:2px 8px;border-radius:999px;}

/* CEFR route */
.route{display:flex;align-items:center;padding:10px 4px 4px;}
.route-stop{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;flex:none;width:64px;}
.route-dot{width:15px;height:15px;border-radius:50%;background:var(--surface-sunken);border:2px solid var(--border);z-index:1;}
.route-stop.done .route-dot{background:var(--sage);border-color:var(--sage-strong);}
.route-stop.current .route-dot{background:var(--blue);border-color:var(--blue-strong);width:19px;height:19px;box-shadow:0 0 0 4px var(--blue-soft);}
.route-label{font-family:var(--font-mono);font-size:11.5px;color:var(--ink-faint);font-weight:600;}
.route-stop.done .route-label,.route-stop.current .route-label{color:var(--ink);}
.route-line{flex:1;height:2px;background:var(--border);margin-top:-24px;}
.route-line.done{background:var(--sage);}

.checklist{display:flex;flex-direction:column;gap:2px;}
.check-row{display:flex;align-items:center;gap:11px;padding:9px 4px;border-radius:var(--r-sm);cursor:pointer;}
.check-row:hover{background:var(--surface-sunken);}
.check-box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--ink-faint);flex:none;display:flex;align-items:center;justify-content:center;}
.check-row.checked .check-box{background:var(--sage-strong);border-color:var(--sage-strong);}
.check-row.checked span.check-text{color:var(--ink-faint);text-decoration:line-through;}
.check-box svg{width:11px;height:11px;color:#fff;}

.mini-list{display:flex;flex-direction:column;}
.mini-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid var(--border);}
.mini-row:last-child{border-bottom:none;}
.mini-main{min-width:0;}
.mini-title{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mini-sub{font-size:11.5px;color:var(--ink-soft);}
.attn-row{border-left:2px solid var(--gold);padding-left:10px;}

.motivation{
  background:var(--sage-soft);border-radius:var(--r-lg);padding:18px 22px;font-family:var(--font-display);
  font-size:16px;color:var(--sage-strong);font-style:italic;
}

/* badges/pills/chips */
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.2px;}
.pill-sage{background:var(--sage-soft);color:var(--sage-strong);}
.pill-blue{background:var(--blue-soft);color:var(--blue-strong);}
.pill-gold{background:var(--gold-soft);color:var(--gold);}
.pill-wine{background:var(--wine-soft);color:var(--wine);}
.pill-neutral{background:var(--surface-sunken);color:var(--ink-soft);}
.tag{font-family:var(--font-mono);font-size:10.5px;color:var(--ink-faint);}
.sample-badge{font-size:9.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);border:1px dashed var(--ink-faint);padding:1px 6px;border-radius:6px;}

/* toolbar/filters */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;}
.toolbar select,.toolbar input[type=text]{
  padding:8px 12px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);color:var(--ink);font-size:13px;
}
.toolbar .tb-search{flex:1;min-width:160px;}

/* index-card style vocab/phrase card */
.idx-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:15px 17px;box-shadow:var(--shadow-sm);
  cursor:pointer;position:relative;display:flex;flex-direction:column;gap:8px;
}
.idx-card::before{
  content:"";position:absolute;top:0;left:16px;width:26px;height:6px;background:var(--surface-sunken);border-radius:0 0 5px 5px;
}
.idx-card:hover{box-shadow:var(--shadow);}
.idx-card.due{border-left:3px solid var(--gold);}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;}
.idx-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.idx-word{font-family:var(--font-display);font-size:18px;font-weight:600;}
.idx-article{color:var(--blue-strong);font-weight:500;}
.idx-translation{color:var(--ink-soft);font-size:13.5px;}
.idx-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;}
.idx-actions{display:flex;gap:6px;margin-top:auto;padding-top:6px;}

/* modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(20,16,8,0.42);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;
}
.modal{
  background:var(--surface);border-radius:var(--r-lg);max-width:560px;width:100%;max-height:88vh;overflow-y:auto;
  box-shadow:var(--shadow-lg);padding:26px 26px 22px;
}
.modal.modal-wide{max-width:760px;}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.modal-close{background:none;border:none;cursor:pointer;color:var(--ink-faint);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.modal-close:hover{background:var(--surface-sunken);color:var(--ink);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);margin-bottom:6px;font-weight:600;}
.field input,.field select,.field textarea{
  width:100%;padding:9px 12px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface-sunken);color:var(--ink);
}
.field textarea{min-height:64px;resize:vertical;font-family:inherit;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media (max-width:520px){.field-row{grid-template-columns:1fr;}}
.field-hint{font-size:11.5px;color:var(--ink-faint);margin-top:4px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;border-top:1px solid var(--border);padding-top:16px;}

/* toast */
#toast-root{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast{background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);
  animation:toast-in .18s ease;}
@keyframes toast-in{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

/* fab */
.fab-wrap{position:fixed;right:26px;bottom:26px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
.fab{
  width:56px;height:56px;border-radius:50%;background:var(--sage-strong);color:#fff;border:none;box-shadow:var(--shadow-lg);
  font-size:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s ease;
}
.fab:hover{transform:scale(1.05);}
.fab-menu{display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
.fab-item{
  background:var(--surface);border:1px solid var(--border);padding:8px 14px;border-radius:999px;box-shadow:var(--shadow);
  font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--ink);
}
.fab-item:hover{background:var(--surface-sunken);}

/* empty state */
.empty-state{text-align:center;padding:56px 20px;color:var(--ink-soft);}
.empty-state .es-icon{font-size:34px;margin-bottom:12px;}
.empty-state h4{font-size:17px;margin-bottom:6px;color:var(--ink);}
.empty-state p{font-size:13.5px;margin-bottom:18px;max-width:340px;margin-left:auto;margin-right:auto;}

/* confirm dialog reuses modal */
.confirm-text{font-size:14px;color:var(--ink-soft);line-height:1.55;}

/* detail drawer */
.detail-section{margin-bottom:16px;}
.detail-section .ds-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink-faint);margin-bottom:5px;font-weight:600;}
.detail-section .ds-body{font-size:14px;line-height:1.6;}
.detail-example{background:var(--surface-sunken);border-radius:var(--r-sm);padding:10px 13px;font-style:italic;}
.mistake-box{border-radius:var(--r-sm);padding:10px 13px;margin-bottom:6px;}
.mistake-wrong{background:var(--wine-soft);color:var(--wine);}
.mistake-right{background:var(--sage-soft);color:var(--sage-strong);}

/* collapsible */
.collapse-head{display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:4px 0;}
.collapse-head svg{width:14px;height:14px;transition:transform .15s ease;}
.collapse.open .collapse-head svg{transform:rotate(90deg);}
.collapse-body{display:none;padding-top:8px;}
.collapse.open .collapse-body{display:block;}

/* grammar card */
.grammar-card{padding:20px 22px;}
.grammar-title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px;}
.rule-block{background:var(--blue-soft);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:10px;}
.mistake-inline{display:flex;flex-direction:column;gap:4px;font-size:13.5px;margin-top:6px;}

/* topics */
.topic-level-head{font-family:var(--font-mono);font-size:12px;letter-spacing:1px;color:var(--ink-faint);margin:22px 0 10px;text-transform:uppercase;}
.topic-level-head:first-child{margin-top:0;}
.topic-card{padding:16px 18px;}
.topic-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
.topic-icon{font-size:20px;}
.topic-counts{display:flex;gap:14px;font-size:12px;color:var(--ink-soft);margin-bottom:10px;}
.topic-counts b{color:var(--ink);font-family:var(--font-mono);}
.progress-track{height:6px;background:var(--surface-sunken);border-radius:999px;overflow:hidden;}
.progress-fill{height:100%;background:var(--sage);border-radius:999px;}

/* revision */
.review-hero{text-align:center;padding:30px 20px;}
.review-hero .rh-count{font-family:var(--font-display);font-size:52px;color:var(--sage-strong);}
.flashcard{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);
  padding:44px 30px;text-align:center;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer;
}
.flashcard .fc-prompt{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--ink-faint);}
.flashcard .fc-main{font-family:var(--font-display);font-size:30px;}
.flashcard .fc-sub{color:var(--ink-soft);font-size:15px;}
.review-progress{display:flex;gap:4px;margin-bottom:18px;}
.review-progress span{flex:1;height:4px;border-radius:999px;background:var(--border);}
.review-progress span.done{background:var(--sage);}
.review-progress span.current{background:var(--blue);}

function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);}
function todayISO(){return new Date().toISOString().slice(0,10);}
function addDays(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function daysUntil(iso){const d=new Date(iso+'T00:00:00');const t=new Date(todayISO()+'T00:00:00');return Math.round((d-t)/86400000);}
function fmtDate(iso){if(!iso)return '—';const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function cap(s){return s? s.charAt(0).toUpperCase()+s.slice(1):s;}
function toCsvCell(v){v=(v==null?'':String(v)).replace(/"/g,'""');return '"'+v+'"';}

function toast(msg){
  const root=document.getElementById('toast-root');
  const el=document.createElement('div');

  el.textContent=msg;
  root.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .25s';setTimeout(()=>el.remove(),250);},1800);
}

/* ================= DATA LAYER ================= */
let state = loadState();
function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw) return migrateState(JSON.parse(raw));
  }catch(e){console.warn('Could not read saved data, starting fresh.',e);}
  const fresh=buildSampleData();
  persist(fresh);
  return fresh;
}
function migrateState(s){
  s.vocab=s.vocab||[];s.phrases=s.phrases||[];s.grammar=s.grammar||[];s.topics=s.topics||[];
  s.notes=s.notes||[];s.mistakes=s.mistakes||[];s.activity=s.activity||{};
  s.meta=s.meta||{};
  s.meta.checklist=s.meta.checklist||{};
  s.meta.goals=s.meta.goals||{vocabPerWeek:10,reviewsPerWeek:3,grammarPerWeek:2,speakingPerWeek:2};
  if(s.meta.checklistDate!==todayISO()){s.meta.checklist={};s.meta.checklistDate=todayISO();}
  return s;
}
function persist(s){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
  }catch(e){
    toast('⚠ Storage is full — try deleting a recording or exporting & clearing old data.');
    console.error(e);
  }
}
function save(){
  persist(state);
}
function logActivity(kind){
  const t=todayISO();
  if(!state.activity[t]) state.activity[t]={vocab:0,phrases:0,grammar:0,reviews:0};
  state.activity[t][kind]=(state.activity[t][kind]||0)+1;
  bumpStreak();
  save();
}
function bumpStreak(){
  const t=todayISO();
  const y=addDays(t,-1);
  if(state.meta.lastActiveDate===t) return;
  if(state.meta.lastActiveDate===y){state.meta.streak=(state.meta.streak||0)+1;}
  else {state.meta.streak=1;}
  state.meta.lastActiveDate=t;
}

/* ================= FORM FIELD BUILDER ================= */
function fieldHTML(f, value){
  const val = value==null?'':value;
  const label = `<label for="f_${f.key}">${esc(f.label)}${f.required?' *':''}</label>`;
  let input='';
  if(f.type==='select'){
    input = `<select id="f_${f.key}" name="${f.key}">${(f.options||[]).map(o=>{
      const ov = typeof o==='object'?o.value:o;
      const ol = typeof o==='object'?o.label:cap(o);
      return `<option value="${esc(ov)}" ${String(val)===String(ov)?'selected':''}>${esc(ol)}</option>`;
    }).join('')}</select>`;
  } else if(f.type==='textarea'){
    input = `<textarea id="f_${f.key}" name="${f.key}" placeholder="${esc(f.placeholder||'')}">${esc(val)}</textarea>`;
  } else {
    input = `<input type="text" id="f_${f.key}" name="${f.key}" value="${esc(val)}" placeholder="${esc(f.placeholder||'')}">`;
  }
  const hint = f.hint?`<div class="field-hint">${esc(f.hint)}</div>`:'';
  return `<div class="field">${label}${input}${hint}</div>`;
}
function buildFieldsHTML(fields, values){
  values = values||{};
  let out='';
  let i=0;
  while(i<fields.length){
    if(fields[i].pairWith){
      out += `<div class="field-row">${fieldHTML(fields[i], values[fields[i].key])}${fieldHTML(fields[i].pairWith, values[fields[i].pairWith.key])}</div>`;
      i++;
    } else {
      out += fieldHTML(fields[i], values[fields[i].key]);
      i++;
    }
  }
  return out;
}
function readFields(fields, root){
  root = root || document;
  const data = {};
  fields.forEach(f=>{
    const el = root.querySelector('#f_'+f.key);
    data[f.key] = el ? el.value.trim() : '';
    if(f.pairWith){
      const el2 = root.querySelector('#f_'+f.pairWith.key);
      data[f.pairWith.key] = el2 ? el2.value.trim() : '';
    }
  });
  return data;
}
/* ================= AUDIO: TTS + RECORDING ================= */
function speakGerman(text){
  if(!('speechSynthesis' in window)){toast('Text-to-speech is not supported in this browser.');return;}
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE';
  u.rate = 0.92;
  window.speechSynthesis.speak(u);
}

let activeRecorder = null;
let recordedChunks = [];
function startRecording(btnId, holderId){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder==='undefined'){
    document.getElementById(holderId).innerHTML = `<div class="audio-note">🎙 Microphone recording isn't supported in this browser/context. Use "🔊 Listen" for computer pronunciation instead.</div>`;
    return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    recordedChunks = [];
    let mime = 'audio/webm';
    try{ if(!MediaRecorder.isTypeSupported(mime)) mime='';}catch(e){mime='';}
    activeRecorder = mime ? new MediaRecorder(stream,{mimeType:mime}) : new MediaRecorder(stream);
    activeRecorder.ondataavailable = e=>{if(e.data.size>0) recordedChunks.push(e.data);};
    activeRecorder.onstop = ()=>{
      stream.getTracks().forEach(tr=>tr.stop());
      const blob = new Blob(recordedChunks, {type: activeRecorder.mimeType||'audio/webm'});
      const reader = new FileReader();
      reader.onloadend = ()=>{
        window.__pendingAudio = reader.result;
        document.getElementById(holderId).innerHTML = renderAudioWidget(reader.result, true);
      };
      reader.readAsDataURL(blob);
    };
    activeRecorder.start();
    document.getElementById(holderId).innerHTML = `
      <div class="audio-row"><span class="pill pill-wine">● Recording… (max 10s)</span>
      <button type="button" class="btn btn-sm" data-action="stop-recording" data-holder="${holderId}">Stop</button></div>`;
    setTimeout(()=>{ if(activeRecorder && activeRecorder.state==='recording') activeRecorder.stop(); },10000);
  }).catch(err=>{
    document.getElementById(holderId).innerHTML = `<div class="audio-note">🎙 Microphone access wasn't granted (${esc(err.name||'error')}). This can happen because the app runs inside a sandboxed preview. You can still use "🔊 Listen" for computer pronunciation, or record on your phone and add the sound as a note.</div>`;
  });
}
function stopRecording(){ if(activeRecorder && activeRecorder.state==='recording') activeRecorder.stop(); }
function renderAudioWidget(existingAudio, justRecorded){
  window.__pendingAudio = existingAudio || window.__pendingAudio || null;
  const holderId = 'audio-holder';
  if(existingAudio){
    return `<div class="audio-row">
      <audio controls src="${existingAudio}" style="height:32px;max-width:220px;"></audio>
      <button type="button" class="btn btn-sm btn-danger" data-action="delete-recording" data-holder="${holderId}">${ICONS.trash} Delete</button>
    </div>${justRecorded?'<div class="field-hint">Recording ready — it will be saved with this entry.</div>':''}`;
  }
  return `<button type="button" class="btn btn-sm" data-action="start-recording" data-holder="${holderId}">${ICONS.mic} Record pronunciation</button>
    <div class="audio-note">Records up to 10 seconds locally in your browser. If your browser blocks microphone access here, use "🔊 Listen" (computer voice) instead.</div>`;
}
function audioFieldBlock(existingAudio){
  window.__pendingAudio = existingAudio || null;
  return `<div class="field"><label>Pronunciation audio</label><div id="audio-holder">${renderAudioWidget(existingAudio)}</div></div>`;
}

  {key:'level',label:'Level',type:'select',options:LEVELS,pairWith:{key:'region',label:'Region',type:'select',options:REGION}},
  {key:'status',label:'Status',type:'select',options:VOCAB_STATUS,pairWith:{key:'difficulty',label:'Difficulty',type:'select',options:DIFFICULTY}},
];
let vocabFilters = {q:'',level:'',category:'',status:'',difficulty:'',sort:'newest'};

function filteredVocab(){
  let arr = state.vocab.filter(v=>{
    if(vocabFilters.level && v.level!==vocabFilters.level) return false;
    if(vocabFilters.category && v.category!==vocabFilters.category) return false;
    if(vocabFilters.status && v.status!==vocabFilters.status) return false;
    if(vocabFilters.difficulty && v.difficulty!==vocabFilters.difficulty) return false;
    if(vocabFilters.q){
      const q=vocabFilters.q.toLowerCase();
      if(![v.word,v.translation,v.note,v.exampleDe].some(x=>(x||'').toLowerCase().includes(q))) return false;
    }
    return true;
  });
  if(vocabFilters.sort==='newest') arr.sort((a,b)=>b.dateAdded.localeCompare(a.dateAdded));
  else if(vocabFilters.sort==='az') arr.sort((a,b)=>a.word.localeCompare(b.word));
  else if(vocabFilters.sort==='review') arr.sort((a,b)=>(a.nextReview||'9999').localeCompare(b.nextReview||'9999'));
  return arr;
}

const STATUS_WEIGHT = {'New':0,'Not started':0,'Learning':0.35,'Familiar':0.65,'Confident':0.65,'Needs Practice':0.15,'Mastered':1};
function topicStats(){
  const names = new Set(ALL_TOPIC_NAMES);
  state.topics.forEach(t=>names.add(t.name));
  return Array.from(names).map(name=>{
    const vocabItems = state.vocab.filter(v=>v.topic===name);
    const phraseItems = state.phrases.filter(p=>p.topic===name);
    const grammarItems = state.grammar.filter(g=>g.topic===name);
    const all = [...vocabItems,...phraseItems,...grammarItems];
    const total = all.length;
    const progress = total? Math.round(100*all.reduce((s,i)=>s+(STATUS_WEIGHT[i.status]||0),0)/total) : 0;
    const level = Object.keys(TOPIC_TREE).find(l=>TOPIC_TREE[l].includes(name)) || (state.topics.find(t=>t.name===name)||{}).level || 'Custom';
    return {name, level, vocab:vocabItems.length, phrases:phraseItems.length, grammar:grammarItems.length, total, progress};
  });
}

let reviewSession = null;
function buildQueue(mode){
  let items = [];
  if(mode==='vocab'||mode==='mixed') items.push(...state.vocab.filter(v=>mode==='mixed'?daysUntil(v.nextReview)<=0:true).map(v=>({kind:'vocab',ref:v})));
  if(mode==='phrases'||mode==='mixed') items.push(...state.phrases.filter(p=>mode==='mixed'?daysUntil(p.nextReview)<=0:true).map(p=>({kind:'phrase',ref:p})));
  if(mode==='grammar'||mode==='mixed') items.push(...state.grammar.filter(g=>g.status!=='Mastered').map(g=>({kind:'grammar',ref:g})));
  if(mode==='mistakes'||mode==='mixed') items.push(...state.mistakes.filter(m=>m.status!=='Fixed').map(m=>({kind:'mistake',ref:m})));
  if(mode==='vocab' && items.length===0) items = state.vocab.slice(0,10).map(v=>({kind:'vocab',ref:v}));
  if(mode==='phrases' && items.length===0) items = state.phrases.slice(0,10).map(p=>({kind:'phrase',ref:p}));
  for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]];}
  return items.slice(0,20);
}
function startReview(mode){
  const queue = buildQueue(mode);
  if(queue.length===0){toast('Nothing to review here yet — add some items first.');return;}
  reviewSession = {queue, index:0, correct:0, needsPractice:0, revealed:false, chosen:null};
  renderReviewScreen();
}
function pickDistractors(pool, correctVal, n){
  const others = pool.filter(v=>v!==correctVal);
  const shuffled = others.sort(()=>Math.random()-0.5).slice(0,n);
  const all = [...shuffled, correctVal];
  return all.sort(()=>Math.random()-0.5);
}
function buildActivity(entry){
  const r = entry.ref;
  if(entry.kind==='vocab'){
    const options = ['flip-de-en','flip-en-de'];
    if(r.article) options.push('mc-article');
    if(r.exampleDe && r.exampleDe.length>4) options.push('fill-gap');
    else options.push('mc-translation');
    const type = options[Math.floor(Math.random()*options.length)];
    return {type, entry};
  }
  if(entry.kind==='phrase'){
    return {type: Math.random()<0.5?'flip-de-en':'flip-en-de', entry};
  }
  if(entry.kind==='grammar') return {type:'flip-grammar', entry};
  return {type:'flip-mistake', entry};
}
function renderReviewScreen(){
  const root = document.getElementById('view-root');
  const s = reviewSession;
  if(s.index>=s.queue.length){ renderReviewSummary(root); return; }
  const entry = s.queue[s.index];
  const activity = buildActivity(entry);
  s.currentActivity = activity;
  s.revealed = false; s.chosen = null;
  root.innerHTML = `
    <div class="view-head"><div><h1 class="view-title">Review session</h1><div class="view-sub">Item ${s.index+1} of ${s.queue.length}</div></div>
      <button class="btn" data-action="exit-review">Exit</button></div>
    <div class="review-progress">${s.queue.map((_,i)=>`<span class="${i<s.index?'done':i===s.index?'current':''}"></span>`).join('')}</div>
    <div id="review-stage"></div>
  `;
  renderActivity(activity);
}
function renderActivity(activity){
  const stage = document.getElementById('review-stage');
  const r = activity.entry.ref;
  const kind = activity.entry.kind;
  if(activity.type==='flip-de-en' || activity.type==='flip-en-de'){
    const front = kind==='vocab' ? (activity.type==='flip-de-en'? r.word : r.translation) : (activity.type==='flip-de-en'? r.phrase : r.translation);
    const back = kind==='vocab' ? (activity.type==='flip-de-en'? r.translation : r.word) : (activity.type==='flip-de-en'? r.translation : r.phrase);
    stage.innerHTML = `
      <div class="flashcard" id="fc" data-action="flip-card">
        <div class="fc-prompt">${activity.type==='flip-de-en'?'German → translation':'Translation → German'}</div>
        <div class="fc-main">${esc(front)}</div>
        <div id="fc-back" class="fc-sub hidden">${esc(back)}</div>
        <div class="field-hint" id="fc-tap">Tap card to reveal</div>
      </div>
      <div id="rate-area"></div>`;
  } else if(activity.type==='mc-translation'){
    const pool = state.vocab.map(v=>v.translation).filter(Boolean);
    const opts = pickDistractors(pool, r.translation, 2);
    stage.innerHTML = `
      <div class="flashcard" style="cursor:default;">
        <div class="fc-prompt">Choose the correct translation</div>
        <div class="fc-main">${esc(r.word)}</div>
      </div>
      <div class="choice-grid" id="choice-grid">${opts.map(o=>`<button class="choice-btn" data-action="choose-answer" data-value="${esc(o)}">${esc(o)}</button>`).join('')}</div>
      <div id="rate-area"></div>`;
    stage.dataset.correct = r.translation;
  } else if(activity.type==='mc-article'){
    const opts = ['der','die','das'];
    stage.innerHTML = `
      <div class="flashcard" style="cursor:default;">
        <div class="fc-prompt">Choose the correct article</div>
        <div class="fc-main">___ ${esc(r.word.replace(/^(der|die|das)\s+/,''))}</div>
        <div class="fc-sub">${esc(r.translation)}</div>
      </div>
      <div class="choice-grid" id="choice-grid">${opts.map(o=>`<button class="choice-btn" data-action="choose-answer" data-value="${o}">${o}</button>`).join('')}</div>
      <div id="rate-area"></div>`;
    stage.dataset.correct = r.article;
  } else if(activity.type==='fill-gap'){
    const word = r.word.replace(/^(der|die|das)\s+/,'');
    const gapped = r.exampleDe.replace(new RegExp(word,'i'), '____');
    stage.innerHTML = `
      <div class="flashcard" style="cursor:default;">
        <div class="fc-prompt">Fill in the gap</div>
        <div class="fc-main" style="font-size:20px;">${esc(gapped)}</div>
        <div class="fc-sub">${esc(r.exampleTranslation||r.translation)}</div>
      </div>
      <div style="display:flex;gap:8px;margin-top:16px;max-width:340px;margin-left:auto;margin-right:auto;">
        <input type="text" id="gap-input" placeholder="Type the missing word" style="flex:1;padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);">
        <button class="btn btn-primary" data-action="check-gap">Check</button>
      </div>
      <div id="rate-area"></div>`;
    stage.dataset.correct = word;
  } else if(activity.type==='flip-grammar'){
    stage.innerHTML = `
      <div class="flashcard" id="fc" data-action="flip-card">
        <div class="fc-prompt">Grammar recall</div>
        <div class="fc-main" style="font-size:22px;">${esc(r.title)}</div>
        <div id="fc-back" class="fc-sub hidden" style="text-align:left;max-width:420px;">${esc(r.rule||r.myExplanation||'')}</div>
        <div class="field-hint" id="fc-tap">Tap to reveal the rule</div>
      </div>
      <div id="rate-area"></div>`;
  } else if(activity.type==='flip-mistake'){
    stage.innerHTML = `
      <div class="flashcard" id="fc" data-action="flip-card">
        <div class="fc-prompt">Correct this sentence</div>
        <div class="fc-main" style="font-size:19px;">❌ ${esc(r.mySentence)}</div>
        <div id="fc-back" class="fc-sub hidden">✓ ${esc(r.correctVersion)}${r.why?`<br><span style="font-size:12.5px;">${esc(r.why)}</span>`:''}</div>
        <div class="field-hint" id="fc-tap">Tap to reveal the correction</div>
      </div>
      <div id="rate-area"></div>`;
  }
}
function flipCard(){
  document.getElementById('fc-back').classList.remove('hidden');
  document.getElementById('fc-tap').textContent='';
  showRateArea();
}
function chooseAnswer(btn){
  const stage = document.getElementById('review-stage');
  const correct = stage.dataset.correct;
  const val = btn.dataset.value;
  document.querySelectorAll('#choice-grid .choice-btn').forEach(b=>{
    b.disabled = true;
    if(b.dataset.value===correct) b.classList.add('correct');
    else if(b===btn) b.classList.add('wrong');
  });
  showRateArea(val===correct);
}
function checkGap(){
  const stage = document.getElementById('review-stage');
  const correct = stage.dataset.correct.toLowerCase();
  const val = document.getElementById('gap-input').value.trim().toLowerCase();
  const ok = val===correct;
  document.getElementById('gap-input').style.borderColor = ok?'var(--sage)':'var(--wine)';
  document.getElementById('gap-input').disabled = true;
  document.querySelector('[data-action="check-gap"]').disabled = true;
  toast(ok?'Correct ✓':`Correct answer: ${stage.dataset.correct}`);
  showRateArea(ok);
}
function showRateArea(suggestedCorrect){
  document.getElementById('rate-area').innerHTML = `
    <div class="rate-row">
      <button class="rate-btn rate-know" data-action="rate-item" data-rating="know">✓ I knew it</button>
      <button class="rate-btn rate-almost" data-action="rate-item" data-rating="almost">~ Almost</button>
      <button class="rate-btn rate-no" data-action="rate-item" data-rating="no">✗ Didn't remember</button>
    </div>`;
}
function rateItem(rating){
  const s = reviewSession;
  const entry = s.queue[s.index];
  const r = entry.ref;
  const statusList = entry.kind==='grammar' ? GRAMMAR_STATUS : VOCAB_STATUS;
  if(entry.kind!=='mistake'){
    let idx = statusList.indexOf(r.status);
    if(idx<0) idx=0;
    if(rating==='know'){ idx = Math.min(idx+1, statusList.length-1); if(statusList[idx]==='Needs Practice') idx++; r.status = statusList[Math.min(idx,statusList.length-1)]; s.correct++; }
    else if(rating==='almost'){ r.status = entry.kind==='grammar'?'Learning':'Learning'; }
    else { r.status = 'Needs Practice'; s.needsPractice++; }
    r.lastReviewed = todayISO();
    if(entry.kind!=='grammar') r.nextReview = addDays(todayISO(), SRS_INTERVAL[r.status]||3);
  } else {
    if(rating==='know'){ r.status='Fixed'; s.correct++; }
    else if(rating==='almost'){ r.status='Improving'; }
    else { r.status='Still making this mistake'; s.needsPractice++; }
  }
  logActivity('reviews');
  s.index++;
  renderReviewScreen();
}
function renderReviewSummary(root){
  const s = reviewSession;
  root.innerHTML = `
    <div class="view-head"><div><h1 class="view-title">Session complete</h1></div></div>
    <div class="section-card" style="text-align:center;">
      <div class="stat-grid" style="margin-top:6px;">
        <div class="stat-tile"><div class="st-label">Reviewed</div><div class="st-value">${s.queue.length}</div></div>
        <div class="stat-tile accent-sage"><div class="st-label">Correct</div><div class="st-value">${s.correct}</div></div>
        <div class="stat-tile accent-gold"><div class="st-label">Needs practice</div><div class="st-value">${s.needsPractice}</div></div>
      </div>
      <button class="btn btn-primary" data-action="nav" data-view="revision">Back to Revision</button>
    </div>
  `;
  reviewSession = null;
}

function usePreset(name){
  const vocabPick = state.vocab.slice(0,8).map(v=>v.id);
  const phrasePick = state.phrases.slice(0,5).map(p=>p.id);
  talkSelection.vocab = new Set(vocabPick);
  talkSelection.phrases = new Set(phrasePick);
  talkSelection.grammar = new Set(state.grammar.slice(0,3).map(g=>g.id));
  talkSelection.mistakes = new Set(state.mistakes.slice(0,3).map(m=>m.id));
  generatePrompt(name);
  renderTalkView(document.getElementById('view-root'));
  document.getElementById('prompt-output-card').classList.remove('hidden');
  document.getElementById('prompt-output').textContent = window.__lastPrompt;
}
function generatePrompt(situation){
  const vocab = state.vocab.filter(v=>talkSelection.vocab.has(v.id));
  const phrases = state.phrases.filter(p=>talkSelection.phrases.has(p.id));
  const grammar = state.grammar.filter(g=>talkSelection.grammar.has(g.id));
  const mistakes = state.mistakes.filter(m=>talkSelection.mistakes.has(m.id));
  let lines = [];
  lines.push('Act as my German conversation partner.');
  lines.push('');
  lines.push(`My current level is ${state.meta.level}, working toward ${state.meta.target}.`);
  if(situation) lines.push(`Today's situation: ${situation}.`);
  if(vocab.length){ lines.push(''); lines.push('Vocabulary to use:'); vocab.forEach(v=>lines.push(`- ${v.word} (${v.translation})`)); }
  if(phrases.length){ lines.push(''); lines.push('Phrases to use:'); phrases.forEach(p=>lines.push(`- ${p.phrase} (${p.translation})`)); }
  if(grammar.length){ lines.push(''); lines.push('Grammar to reinforce:'); grammar.forEach(g=>lines.push(`- ${g.title}`)); }
  if(mistakes.length){ lines.push(''); lines.push('My common mistakes — please watch for these:'); mistakes.forEach(m=>lines.push(`- ${m.mySentence} → ${m.correctVersion}`)); }
  lines.push('');
  lines.push('Please speak to me mostly in simple German.');
  lines.push('If I make a mistake:');
  lines.push('1. Let me finish my sentence.');
  lines.push('2. Correct me.');
  lines.push('3. Briefly explain the mistake in English.');
  lines.push('4. Ask me a natural follow-up question.');
  lines.push('');
  lines.push('Do not use vocabulary significantly above my level unless you explain it.');
  lines.push('Simulate a realistic conversation rather than a textbook exercise.');
  window.__lastPrompt = lines.join('\n');
  return window.__lastPrompt;
}
function handleGeneratePrompt(){
  generatePrompt(null);
  document.getElementById('prompt-output-card').classList.remove('hidden');
  document.getElementById('prompt-output').textContent = window.__lastPrompt;
  document.getElementById('prompt-output-card').scrollIntoView({behavior:'smooth', block:'start'});
}
function copyPrompt(){
  if(!window.__lastPrompt){toast('Create a prompt first.');return;}
  navigator.clipboard.writeText(window.__lastPrompt).then(()=>toast('Prompt copied ✓')).catch(()=>toast('Could not copy — select the text manually.'));
}
function togglePick(group,id){
  const set = talkSelection[group];
  if(set.has(id)) set.delete(id); else set.add(id);
}
/* ================= PROGRESS ================= */
function weekActivity(){
  const days=[];
  for(let i=6;i>=0;i--){
    const d = addDays(todayISO(), -i);
    const a = state.activity[d]||{vocab:0,phrases:0,grammar:0,reviews:0};
    const total = a.vocab+a.phrases+a.grammar+a.reviews;
    days.push({date:d, total, label:new Date(d+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short'}).slice(0,2)});
  }
  return days;
}
function weekCount(kind){
  let n=0;
  for(let i=6;i>=0;i--){ const d=addDays(todayISO(),-i); if(state.activity[d]) n+=(state.activity[d][kind]||0); }
  return n;
}
function monthCount(kind, arr, dateField){
  const cutoff = addDays(todayISO(), -30);
  return arr.filter(x=>x[dateField]>=cutoff).length;
}

    <div class="stat-grid">
      <div class="stat-tile"><div class="st-label">Words this week</div><div class="st-value">${vocabWeek}</div></div>
      <div class="stat-tile"><div class="st-label">Words this month</div><div class="st-value">${monthCount('vocab',state.vocab,'dateAdded')}</div></div>
      <div class="stat-tile"><div class="st-label">Grammar completed</div><div class="st-value">${state.grammar.filter(g=>g.status==='Mastered'||g.status==='Confident').length}</div></div>
      <div class="stat-tile"><div class="st-label">Phrases learned</div><div class="st-value">${state.phrases.filter(p=>p.status!=='New').length}</div></div>
      <div class="stat-tile"><div class="st-label">Review sessions</div><div class="st-value">${reviewsWeek}</div><div class="st-hint">this week</div></div>
      <div class="stat-tile accent-sage"><div class="st-label">Streak</div><div class="st-value">🔥 ${state.meta.streak||0}</div></div>
    </div>
    <div class="section-card">
      <div class="section-head"><h3>CEFR roadmap</h3></div>

    </div>
    <div class="dash-grid">
      <div class="section-card">
        <div class="section-head"><h3>Weekly activity</h3></div>
        <div class="week-chart">${week.map(w=>`
          <div class="week-bar-wrap">
            <div class="week-bar ${w.date===todayISO()?'today':''}" style="height:${Math.max(4,(w.total/maxVal)*100)}%;" title="${w.total} actions"></div>
            <div class="week-bar-label">${w.label}</div>

        ${goalRow('Vocabulary', vocabWeek, goals.vocabPerWeek, 'words')}

function goalRow(label, current, target, unit){
  const pct = Math.min(100, Math.round(100*current/Math.max(1,target)));
  return `<div class="goal-row"><div class="goal-row-head"><span>${label}</span><b>${current} / ${target} ${unit}</b></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%;"></div></div></div>`;
}

function toCsv(rows, headers){
  const lines = [headers.map(toCsvCell).join(',')];
  rows.forEach(r=>lines.push(headers.map(h=>toCsvCell(r[h])).join(',')));
  return lines.join('\n');
}
function exportData(format){
  let text, label;
  if(format==='json'){ text = JSON.stringify(state, null, 2); label='All data (JSON)'; }
  else if(format==='csv-vocab'){ text = toCsv(state.vocab, ['word','translation','article','plural','level','category','status','difficulty','dateAdded']); label='Vocabulary (CSV)'; }
  else if(format==='csv-phrases'){ text = toCsv(state.phrases, ['phrase','translation','context','level','category','status','dateAdded']); label='Phrases (CSV)'; }
  else if(format==='csv-grammar'){ text = toCsv(state.grammar.map(g=>Object.assign({},g,{examples:(g.examples||[]).join(' | ')})), ['title','level','rule','status','difficulty','dateAdded']); label='Grammar (CSV)'; }
  else if(format==='csv-mistakes'){ text = toCsv(state.mistakes, ['mySentence','correctVersion','why','category','status','dateAdded']); label='Mistakes (CSV)'; }
  openModal(`
    <div class="modal-head"><h3>${label}</h3><button class="modal-close" data-action="close-modal">✕</button></div>
    <p class="mini-sub" style="margin-bottom:10px;">Select all and copy, then paste into a text file to save it.</p>
    <textarea readonly style="width:100%;height:280px;font-family:var(--font-mono);font-size:12px;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--surface-sunken);color:var(--ink);" id="export-textarea">${esc(text)}</textarea>
    <div class="modal-actions"><button class="btn btn-primary" data-action="copy-export">Select & Copy</button></div>
  `, {wide:true});
}
function copyExportText(){

  navigator.clipboard.writeText(ta.value).then(()=>toast('Copied ✓')).catch(()=>toast('Copy failed — text is selected, use Cmd/Ctrl+C.'));
}

/* ================= GLOBAL SEARCH ================= */
function runGlobalSearch(q){
  const panel = document.getElementById('search-results');
  if(!q || q.trim().length<2){ panel.classList.add('hidden'); panel.innerHTML=''; return; }
  const needle = q.toLowerCase();
  const hit = (...vals)=>vals.some(v=>(v||'').toLowerCase().includes(needle));
  const groups = [
    {label:'Vocabulary', view:'vocab', items: state.vocab.filter(v=>hit(v.word,v.translation,v.note,v.exampleDe)).slice(0,5).map(v=>({id:v.id,title:v.word,sub:v.translation}))},
    {label:'Phrases', view:'phrases', items: state.phrases.filter(p=>hit(p.phrase,p.translation,p.context)).slice(0,5).map(p=>({id:p.id,title:p.phrase,sub:p.translation}))},
    {label:'Grammar', view:'grammar', items: state.grammar.filter(g=>hit(g.title,g.rule,g.myExplanation)).slice(0,5).map(g=>({id:g.id,title:g.title,sub:g.level}))},
    {label:'Notes', view:'notes', items: state.notes.filter(n=>hit(n.title,n.content)).slice(0,5).map(n=>({id:n.id,title:n.title,sub:n.category}))},
    {label:'Mistakes', view:'mistakes', items: state.mistakes.filter(m=>hit(m.mySentence,m.correctVersion,m.why)).slice(0,5).map(m=>({id:m.id,title:m.mySentence,sub:m.category}))},
  ].filter(g=>g.items.length);
  if(!groups.length){ panel.innerHTML = `<div class="search-empty">No results for "${esc(q)}".</div>`; panel.classList.remove('hidden'); return; }
  panel.innerHTML = groups.map(g=>`
    <div class="search-group-label">${g.label}</div>
    ${g.items.map(it=>`<div class="search-result-row" data-action="search-goto" data-view="${g.view}" data-id="${it.id}">
      <span>${esc(it.title)}</span><span class="mini-sub">${esc(it.sub||'')}</span>
    </div>`).join('')}
  `).join('');
  panel.classList.remove('hidden');
}
function searchGoto(view, id){
  document.getElementById('search-results').classList.add('hidden');
  document.getElementById('global-search').value='';
  navigate(view);
  setTimeout(()=>{
    if(view==='vocab') openVocabDetail(id);
    else if(view==='phrases') openPhraseDetail(id);
    else if(view==='grammar') openGrammarForm(state.grammar.find(g=>g.id===id));
    else if(view==='notes') openNoteForm(state.notes.find(n=>n.id===id));
    else if(view==='mistakes') openMistakeForm(state.mistakes.find(m=>m.id===id));
  }, 30);
}

/* ================= EVENT DELEGATION ================= */
document.addEventListener('click', e=>{
  const el = e.target.closest('[data-action]');
  const fab = document.getElementById('fab-menu');
  if(fab && !fab.classList.contains('hidden') && !e.target.closest('.fab-wrap')) fab.classList.add('hidden');
  const sr = document.getElementById('search-results');
  if(sr && !sr.classList.contains('hidden') && !e.target.closest('.search-wrap')) { sr.classList.add('hidden'); }
  if(!el) return;
  const a = el.dataset.action;
  switch(a){
    case 'nav': navigate(el.dataset.view); break;
    case 'open-level-editor': openLevelEditor(); break;
    case 'toggle-check': {
      const k = el.dataset.key;
      state.meta.checklist[k] = !state.meta.checklist[k];
      save(); renderDashboard(document.getElementById('view-root'));
      break;
    }
    case 'add-vocab': openVocabForm(); break;
    case 'edit-vocab': closeModal(); openVocabForm(state.vocab.find(v=>v.id===el.dataset.id)); break;
    case 'delete-vocab': closeModal(); deleteVocab(el.dataset.id); break;
    case 'open-vocab-detail': openVocabDetail(el.dataset.id); break;
    case 'speak': speakGerman(el.dataset.text); break;
    case 'add-phrase': openPhraseForm(); break;
    case 'edit-phrase': closeModal(); openPhraseForm(state.phrases.find(p=>p.id===el.dataset.id)); break;
    case 'delete-phrase': closeModal(); deletePhrase(el.dataset.id); break;
    case 'open-phrase-detail': openPhraseDetail(el.dataset.id); break;
    case 'add-grammar': openGrammarForm(); break;
    case 'edit-grammar': openGrammarForm(state.grammar.find(g=>g.id===el.dataset.id)); break;
    case 'delete-grammar': deleteGrammar(el.dataset.id); break;
    case 'toggle-collapse': toggleCollapse(el); break;
    case 'add-topic': openTopicForm(); break;
    case 'open-topic-detail': openTopicDetail(el.dataset.name); break;
    case 'add-note': openNoteForm(); break;
    case 'edit-note': openNoteForm(state.notes.find(n=>n.id===el.dataset.id)); break;
    case 'delete-note': closeModal(); deleteNote(el.dataset.id); break;
    case 'add-mistake': openMistakeForm(); break;
    case 'edit-mistake': openMistakeForm(state.mistakes.find(m=>m.id===el.dataset.id)); break;
    case 'delete-mistake': deleteMistake(el.dataset.id); break;
    case 'start-review': startReview(el.dataset.mode); break;
    case 'exit-review': exitReview(); break;
    case 'flip-card': flipCard(); break;
    case 'choose-answer': chooseAnswer(el); break;
    case 'check-gap': checkGap(); break;
    case 'rate-item': rateItem(el.dataset.rating); break;
    case 'use-preset': usePreset(el.dataset.name); break;
    case 'toggle-pick': togglePick(el.dataset.group, el.dataset.id); break;
    case 'generate-prompt': handleGeneratePrompt(); break;
    case 'copy-prompt': copyPrompt(); break;
    case 'edit-goals': openGoalsEditor(); break;
    case 'export-data': exportData(el.dataset.format); break;
    case 'copy-export': copyExportText(); break;
    case 'clear-sample-data': clearSampleData(); break;
    case 'reset-all-data': resetAllData(); break;
    case 'close-modal': closeModal(); break;
    case 'modal-overlay-click': if(e.target===el) closeModal(); break;
    case 'quick-add': quickAdd(el.dataset.type); break;
    case 'toggle-fab': toggleFab(); break;
    case 'start-recording': startRecording(null, el.dataset.holder); break;
    case 'stop-recording': stopRecording(); break;
    case 'delete-recording': window.__pendingAudio=null; document.getElementById(el.dataset.holder).innerHTML = renderAudioWidget(null); break;
    case 'search-goto': searchGoto(el.dataset.view, el.dataset.id); break;
  }
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeModal(); const sr=document.getElementById('search-results'); if(sr) sr.classList.add('hidden'); }
});
document.getElementById('global-search').addEventListener('input', e=>{
  clearTimeout(window.__searchDebounce);
  const val = e.target.value;
  window.__searchDebounce = setTimeout(()=>runGlobalSearch(val), 150);
});

/* ================= INIT ================= */
render();

</script>
</body>
</html>
